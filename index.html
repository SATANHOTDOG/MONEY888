<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家具專員獎金計算</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .text-gradient { background: linear-gradient(to right, #60a5fa, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-5 bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
            <div class="flex items-center gap-3">
                <h1 class="text-3xl font-bold text-gradient tracking-wide">家具專員獎金計算</h1>
                <span class="px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-full text-xs font-semibold flex items-center gap-1">
                    <span id="sync-status" class="block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    雲端連線版
                </span>
            </div>
            
            <div class="flex flex-wrap gap-3 items-center w-full xl:w-auto">
                <div class="relative w-full md:w-64">
                    <input type="text" id="search-input" placeholder="搜尋單號、姓名、手機、備註..." class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
                    <svg class="w-4 h-4 absolute left-3 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <div class="flex items-center gap-2 bg-slate-900 border border-slate-700 rounded-lg p-1 w-full md:w-auto">
                    <span class="text-xs text-slate-400 pl-2">出貨區間:</span>
                    <input type="month" id="start-month" class="bg-transparent text-sm border-none focus:ring-0 text-slate-200 cursor-pointer p-1.5">
                    <span class="text-slate-500">-</span>
                    <input type="month" id="end-month" class="bg-transparent text-sm border-none focus:ring-0 text-slate-200 cursor-pointer p-1.5">
                    <button onclick="fetchData()" class="bg-blue-600 hover:bg-blue-500 text-white p-2 rounded-md transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg></button>
                </div>
            </div>
        </header>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/5 rounded-full blur-3xl -mr-10 -mt-10 transition-transform group-hover:scale-150"></div>
                <h3 class="text-slate-400 text-sm font-semibold mb-2 flex items-center gap-2"><svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg> 區間出貨業績 (自動除稅後)</h3>
                <div class="flex items-end gap-3 mb-4">
                    <span id="total-revenue" class="text-5xl font-black text-white tracking-tight">$0</span>
                    <span id="threshold-status" class="mb-1 text-sm font-medium px-2 py-0.5 rounded-md bg-slate-700 text-slate-300">計算中...</span>
                </div>
                <div class="w-full bg-slate-900 rounded-full h-2 mb-2 border border-slate-700">
                    <div id="progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-1000 ease-out" style="width: 0%"></div>
                </div>
                <p class="text-xs text-slate-500">獎金門檻進度 (40萬) - 跨月將合併顯示進度，但分開計算</p>
            </div>

            <div class="bg-slate-800 p-6 rounded-xl border border-amber-500/20 shadow-[0_0_15px_rgba(245,158,11,0.1)] relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-32 h-32 bg-amber-500/5 rounded-full blur-3xl -mr-10 -mt-10 transition-transform group-hover:scale-150"></div>
                <h3 class="text-amber-400/80 text-sm font-semibold mb-2 flex items-center gap-2"><svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> 預估個人獎金 (按月獨立累進結算)</h3>
                <div class="flex items-end gap-3 mb-4">
                    <span id="total-bonus" class="text-5xl font-black text-amber-400 tracking-tight">$0</span>
                </div>
                <div class="flex items-center gap-2 mt-6">
                    <span id="tier-badge" class="px-2.5 py-1 bg-amber-500/10 text-amber-300 border border-amber-500/30 rounded text-xs font-semibold">當月最高級距: 計算中</span>
                    <span class="text-xs text-slate-500">公式: 折扣前未稅業績 × (100%-折扣率) × 門檻級距</span>
                </div>
            </div>
        </div>

        <!-- Data Table -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
                <h3 class="text-sm font-bold text-slate-300 flex items-center gap-2"><svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg> 出貨明細與業績清單</h3>
                <span id="record-count" class="text-xs bg-slate-700 text-slate-300 px-2 py-1 rounded-md">0 筆資料</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900/50 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="px-6 py-4 font-semibold w-24">出貨日</th>
                            <th class="px-6 py-4 font-semibold">單號</th>
                            <th class="px-6 py-4 font-semibold">顧客姓名</th>
                            <th class="px-6 py-4 font-semibold">狀態/運送</th>
                            <th class="px-6 py-4 font-semibold">貨押日</th>
                            <th class="px-6 py-4 font-semibold text-right">折扣率</th>
                            <th class="px-6 py-4 font-semibold text-right">除稅後業績</th>
                            <th class="px-6 py-4 font-semibold text-right">有效獎金基數</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-700/50 text-sm">
                        <!-- Rows will be injected here -->
                    </tbody>
                </table>
                <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-slate-500">
                    <svg class="w-12 h-12 mb-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <p class="text-sm font-medium">目前沒有符合條件的資料</p>
                    <p class="text-xs mt-1">請調整篩選區間，或確認 CSV 連結是否正確包含當月資料</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for details -->
    <div id="detail-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center opacity-0 transition-opacity duration-200">
        <div class="bg-slate-800 w-full max-w-2xl rounded-2xl shadow-2xl border border-slate-600 transform scale-95 transition-transform duration-200 overflow-hidden" id="modal-content">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800/80">
                <div>
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">訂單詳細資訊</h2>
                    <p id="modal-order-id" class="text-sm text-slate-400 font-mono mt-1"></p>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition-colors bg-slate-700 hover:bg-slate-600 p-2 rounded-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6 grid grid-cols-2 gap-x-8 gap-y-6" id="modal-body">
                <!-- Content injected here -->
            </div>
            <div class="p-4 border-t border-slate-700 bg-slate-900/50 flex justify-end">
                <button onclick="closeModal()" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-medium transition-colors">關閉</button>
            </div>
        </div>
    </div>

    <script>
        // 🚨🚨🚨 請將這裡替換成您在 Google 試算表發佈為 CSV 的網址 🚨🚨🚨
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSsiRtuRUot8LDq8j8rDjaWbGOyEj5w_E2GPYRmasu7WrSYLgECaYA9V5rAcbY-jcCVWWG2l_jKIWpU/pub?gid=1593533278&single=true&output=csv';

        let rawData = [];
        const today = new Date();
        const currentMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
        document.getElementById('start-month').value = currentMonth;
        document.getElementById('end-month').value = currentMonth;

        const formatTWD = (num) => new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', maximumFractionDigits: 0 }).format(num);
        
        const parseNumber = (val) => {
            if (!val) return 0;
            const cleaned = String(val).replace(/,/g, '').replace(/\$/g, '').trim();
            return isNaN(Number(cleaned)) ? 0 : Number(cleaned);
        };

        const standardizeDate = (dateStr) => {
            if (!dateStr) return '';
            const parts = String(dateStr).split('/');
            if (parts.length >= 2) {
                return `${parts[0]}-${parts[1].padStart(2, '0')}`;
            }
            return String(dateStr);
        };

        const getDaysDiff = (dateStr) => {
            if (!dateStr) return null;
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return null;
            const diffTime = d - today;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        };

        function calculateTierBonus(taxFree, effective) {
            if (taxFree < 400000) return 0;
            let remaining = taxFree;
            let ratio = taxFree > 0 ? (effective / taxFree) : 0;
            let bonus = 0;
            
            let tier1 = Math.max(0, Math.min(remaining, 800000) - 400000);
            bonus += tier1 * ratio * 0.02;
            
            let tier2 = Math.max(0, Math.min(remaining, 1200000) - 800000);
            bonus += tier2 * ratio * 0.025;
            
            let tier3 = Math.max(0, Math.min(remaining, 1600000) - 1200000);
            bonus += tier3 * ratio * 0.03;
            
            let tier4 = Math.max(0, Math.min(remaining, 2000000) - 1600000);
            bonus += tier4 * ratio * 0.035;
            
            let tier5 = Math.max(0, remaining - 2000000);
            bonus += tier5 * ratio * 0.04;
            
            return bonus;
        }

        function getHighestTierRate(taxFree) {
            if (taxFree < 400000) return '未達標 (0%)';
            if (taxFree < 800000) return '最高 2.0%';
            if (taxFree < 1200000) return '最高 2.5%';
            if (taxFree < 1600000) return '最高 3.0%';
            if (taxFree < 2000000) return '最高 3.5%';
            return '最高 4.0%';
        }

        async function fetchData() {
            if (CSV_URL === 'YOUR_PUBLISHED_CSV_URL_HERE') {
                renderTable([]);
                return;
            }

            const statusDot = document.getElementById('sync-status');
            statusDot.classList.replace('bg-emerald-400', 'bg-amber-400');

            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    rawData = results.data;
                    statusDot.classList.replace('bg-amber-400', 'bg-emerald-400');
                    filterAndRender();
                },
                error: function(err) {
                    console.error("CSV讀取失敗:", err);
                    statusDot.classList.replace('bg-amber-400', 'bg-red-500');
                    alert("讀取試算表失敗，請確認網址是否正確。");
                }
            });
        }

        function filterAndRender() {
            const startMonth = document.getElementById('start-month').value;
            const endMonth = document.getElementById('end-month').value;
            const searchKeyword = document.getElementById('search-input').value.toLowerCase();

            let monthlyStats = {};
            let globalTotalTaxFree = 0;
            let globalTotalBonus = 0;
            let highestGlobalTaxFree = 0;

            const filteredData = rawData.filter(row => {
                const outDate = row['出貨日'] || row['出貨日期'] || '';
                const yyyyMM = standardizeDate(outDate);
                
                let isDateInRange = true;
                if (startMonth && endMonth) {
                    isDateInRange = (yyyyMM >= startMonth && yyyyMM <= endMonth);
                }

                const searchableString = Object.values(row).join(' ').toLowerCase();
                const isMatchSearch = searchableString.includes(searchKeyword);

                return isDateInRange && isMatchSearch;
            }).map(row => {
                // 1. 強制除稅機制
                const totalStr = row['總計'] || row['總計(除去非82)'] || row['總計(除82+28)'] || '0';
                const itemTotal = parseNumber(totalStr);
                const taxFree = itemTotal / 1.05;

                // 2. 精準折扣打擊
                const discountStr = row['折扣率'] || '0';
                const discountRate = parseFloat(String(discountStr).replace('%', '')) / 100 || 0;
                const effectiveTaxFree = taxFree * (1 - discountRate);

                const yyyyMM = standardizeDate(row['出貨日'] || row['出貨日期']);
                
                if (yyyyMM) {
                    if (!monthlyStats[yyyyMM]) {
                        monthlyStats[yyyyMM] = { taxFree: 0, effective: 0 };
                    }
                    monthlyStats[yyyyMM].taxFree += taxFree;
                    monthlyStats[yyyyMM].effective += effectiveTaxFree;
                }

                return { ...row, _taxFree: taxFree, _effective: effectiveTaxFree, _discountRateStr: discountStr };
            });

            // 分月計算累進獎金
            for (const month in monthlyStats) {
                const stats = monthlyStats[month];
                globalTotalTaxFree += stats.taxFree;
                globalTotalBonus += calculateTierBonus(stats.taxFree, stats.effective);
                if (stats.taxFree > highestGlobalTaxFree) highestGlobalTaxFree = stats.taxFree;
            }

            updateDashboard(globalTotalTaxFree, globalTotalBonus, highestGlobalTaxFree);
            renderTable(filteredData);
        }

        function updateDashboard(totalTaxFree, totalBonus, highestMonthTaxFree) {
            document.getElementById('total-revenue').innerText = formatTWD(totalTaxFree);
            document.getElementById('total-bonus').innerText = formatTWD(totalBonus);
            
            const progress = Math.min((totalTaxFree / 400000) * 100, 100);
            document.getElementById('progress-bar').style.width = `${progress}%`;
            
            const thresholdStatus = document.getElementById('threshold-status');
            if (totalTaxFree >= 400000) {
                thresholdStatus.innerText = '達標 40 萬門檻';
                thresholdStatus.className = 'mb-1 text-sm font-medium px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                document.getElementById('progress-bar').classList.replace('bg-blue-500', 'bg-emerald-500');
            } else {
                const lack = 400000 - totalTaxFree;
                thresholdStatus.innerText = `差 ${formatTWD(lack)} 達標`;
                thresholdStatus.className = 'mb-1 text-sm font-medium px-2 py-0.5 rounded-md bg-red-500/20 text-red-400 border border-red-500/30';
                document.getElementById('progress-bar').classList.replace('bg-emerald-500', 'bg-blue-500');
            }

            document.getElementById('tier-badge').innerText = `當月最高級距: ${getHighestTierRate(highestMonthTaxFree)}`;
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            const emptyState = document.getElementById('empty-state');
            document.getElementById('record-count').innerText = `${data.length} 筆資料`;
            
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                emptyState.classList.replace('hidden', 'flex');
                return;
            }
            emptyState.classList.replace('flex', 'hidden');

            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-700/30 transition-colors cursor-pointer group';
                tr.onclick = () => openModal(index);
                
                const outDate = row['出貨日'] || row['出貨日期'] || '-';
                const orderId = row['單號'] || '-';
                const customer = row['顧客姓名'] || '-';
                const status = row['訂單狀態'] || '-';
                const transport = row['運送狀態'] || '-';
                const pledgeDate = row['貨押日'] || '-';

                // 倉儲防爆警告邏輯
                let pledgeAlert = '';
                if (transport.includes('未排程')) {
                    const days = getDaysDiff(pledgeDate);
                    if (days !== null && days <= 7 && days >= -30) {
                        pledgeAlert = `<span class="ml-2 inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium bg-red-500/20 text-red-400 border border-red-500/30 animate-pulse">即將到貨警告</span>`;
                    }
                }

                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-slate-300 font-medium">${outDate}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-blue-400 font-mono text-xs">${orderId}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-slate-300">${customer}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 py-1 bg-slate-700/50 rounded text-xs text-slate-400 border border-slate-600">${status} / ${transport}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-slate-300">${pledgeDate}${pledgeAlert}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-amber-400/80">${row._discountRateStr}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-slate-300 font-mono">${formatTWD(row._taxFree)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-emerald-400 font-mono group-hover:font-bold">${formatTWD(row._effective)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Search listener
        document.getElementById('search-input').addEventListener('input', filterAndRender);
        document.getElementById('start-month').addEventListener('change', filterAndRender);
        document.getElementById('end-month').addEventListener('change', filterAndRender);

        // Modal logic
        function openModal(index) {
            const data = rawData.filter(row => {
                const yyyyMM = standardizeDate(row['出貨日'] || row['出貨日期']);
                const start = document.getElementById('start-month').value;
                const end = document.getElementById('end-month').value;
                if (start && end && (yyyyMM < start || yyyyMM > end)) return false;
                const search = document.getElementById('search-input').value.toLowerCase();
                return Object.values(row).join(' ').toLowerCase().includes(search);
            })[index];

            if(!data) return;

            document.getElementById('modal-order-id').innerText = `單號: ${data['單號'] || '無'}`;
            
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = '';
            
            const orderFields = ['顧客姓名', '手機', '訂單狀態', '運送狀態', '接單日', '出貨日', '時間', '貨押日'];
            const amountFields = ['82+28大類原金額', '66大類原金額', '非82大類原金額', '總計', '總計(除去非82)', '折扣率', '備註'];

            const renderField = (key, value, highlight = false) => {
                if(value === undefined || value === '') return;
                const div = document.createElement('div');
                div.className = 'flex flex-col gap-1';
                div.innerHTML = `
                    <span class="text-xs text-slate-500 uppercase tracking-wider">${key}</span>
                    <span class="text-sm ${highlight ? 'text-blue-400 font-mono text-base' : 'text-slate-200'}">${value}</span>
                `;
                modalBody.appendChild(div);
            };

            orderFields.forEach(k => renderField(k, data[k]));
            amountFields.forEach(k => renderField(k, data[k], k.includes('金額') || k.includes('總計')));

            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('modal-content');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        window.onload = fetchData;
    </script>
</body>
</html>
