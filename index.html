    <script>
        // 🚨 這裡要放你最新的那串網址 🚨
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSsiRtuRUot8LDq8j8rDjaWbGOyEj5w_E2GPYRmasu7WrSYLgECaYA9V5rAcbY-jcCVWWG2l_jKIWpU/pub?gid=1593533278&single=true&output=csv';

        let rawData = [];
        let currentFilteredData = [];
        const today = new Date();
        const currentMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
        document.getElementById('start-month').value = currentMonth;
        document.getElementById('end-month').value = currentMonth;

        const formatTWD = (num) => new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', maximumFractionDigits: 0 }).format(num);
        const parseNumber = (val) => {
            if (!val) return 0;
            const cleaned = String(val).replace(/,/g, '').replace(/\$/g, '').trim();
            return isNaN(Number(cleaned)) ? 0 : Number(cleaned);
        };
        const standardizeDate = (dateStr) => {
            if (!dateStr) return '';
            const parts = String(dateStr).split('/');
            return parts.length >= 2 ? `${parts[0]}-${parts[1].padStart(2, '0')}` : String(dateStr).trim();
        };

        const findKey = (row, keywords) => {
            const keys = Object.keys(row);
            for (let k of keys) {
                const cleanKey = k.replace(/\s+/g, ''); 
                if (keywords.some(kw => cleanKey.includes(kw))) return k;
            }
            return null;
        };

        const getDaysDiff = (dateStr) => {
            if (!dateStr) return null;
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return null;
            const diffTime = d - today;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        };

        function calculateSimpleBonus(taxFree) {
            if (taxFree < 400000) return 0;
            return taxFree * 0.02;
        }
        
        // 點擊「搜尋全部」時觸發：清空日期，觸發搜尋
        function clearDateRange() {
            document.getElementById('start-month').value = '';
            document.getElementById('end-month').value = '';
            filterAndRender();
        }

        function fetchData() {
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    rawData = results.data;
                    document.getElementById('sync-status').classList.replace('bg-amber-400', 'bg-emerald-400');
                    filterAndRender();
                }
            });
        }

        function filterAndRender() {
            const startMonth = document.getElementById('start-month').value;
            const endMonth = document.getElementById('end-month').value;
            const searchKeyword = document.getElementById('search-input').value.toLowerCase();

            let monthlyStats = {};
            let globalTotalTaxFree = 0;
            let globalTotalBonus = 0;

            currentFilteredData = rawData.filter(row => {
                const dateKey = findKey(row, ['出貨日', '出貨日期']);
                const outDate = dateKey ? row[dateKey] : '';
                const yyyyMM = standardizeDate(outDate);
                if (!yyyyMM || yyyyMM.length < 6) return false;
                
                // 如果開始跟結束時間都有填，才限制範圍；只要清空一個，就放行全搜
                let isDateInRange = true;
                if (startMonth && endMonth) {
                    isDateInRange = (yyyyMM >= startMonth && yyyyMM <= endMonth);
                }
                
                return isDateInRange && Object.values(row).join(' ').toLowerCase().includes(searchKeyword);
            }).map(row => {
                const totalKey = findKey(row, ['總計', '總額']);
                const taxFree = parseNumber(totalKey ? row[totalKey] : '0') / 1.05;

                const dateKey = findKey(row, ['出貨日', '出貨日期']);
                const yyyyMM = standardizeDate(dateKey ? row[dateKey] : '');
                
                if (yyyyMM) {
                    if (!monthlyStats[yyyyMM]) monthlyStats[yyyyMM] = { taxFree: 0 };
                    monthlyStats[yyyyMM].taxFree += taxFree;
                }

                return { 
                    ...row, 
                    _taxFree: taxFree, 
                    _mappedStatus: findKey(row, ['訂單狀態']) ? row[findKey(row, ['訂單狀態'])] : '-',
                    _mappedTransport: findKey(row, ['運送狀態']) ? row[findKey(row, ['運送狀態'])] : '-',
                    _mappedPledge: findKey(row, ['貨押日']) ? row[findKey(row, ['貨押日'])] : '-',
                    _mappedCustomer: findKey(row, ['顧客姓名', '姓名']) ? row[findKey(row, ['顧客姓名', '姓名'])] : '-',
                    _mappedOrder: findKey(row, ['單號', '編號']) ? row[findKey(row, ['單號', '編號'])] : '-',
                    _mappedDate: findKey(row, ['出貨日']) ? row[findKey(row, ['出貨日'])] : '-'
                };
            });

            for (const month in monthlyStats) {
                const stats = monthlyStats[month];
                globalTotalTaxFree += stats.taxFree;
                globalTotalBonus += calculateSimpleBonus(stats.taxFree);
            }

            document.getElementById('total-revenue').innerText = formatTWD(globalTotalTaxFree);
            document.getElementById('total-bonus').innerText = formatTWD(globalTotalBonus);
            document.getElementById('progress-bar').style.width = `${Math.min((globalTotalTaxFree / 400000) * 100, 100)}%`;
            
            const thresholdStatus = document.getElementById('threshold-status');
            if (globalTotalTaxFree >= 400000) {
                thresholdStatus.innerText = '達標 40 萬門檻';
                thresholdStatus.className = 'mb-1 text-sm font-medium px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                document.getElementById('progress-bar').classList.replace('bg-blue-500', 'bg-emerald-500');
            } else {
                thresholdStatus.innerText = `差 ${formatTWD(400000 - globalTotalTaxFree)} 達標`;
                thresholdStatus.className = 'mb-1 text-sm font-medium px-2 py-0.5 rounded-md bg-red-500/20 text-red-400 border border-red-500/30';
                document.getElementById('progress-bar').classList.replace('bg-emerald-500', 'bg-blue-500');
            }

            const tbody = document.getElementById('table-body');
            document.getElementById('record-count').innerText = `${currentFilteredData.length} 筆資料`;
            tbody.innerHTML = '';
            
            if (currentFilteredData.length === 0) {
                document.getElementById('empty-state').classList.replace('hidden', 'flex');
                return;
            }
            document.getElementById('empty-state').classList.replace('flex', 'hidden');

            currentFilteredData.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-700/30 transition-colors cursor-pointer group';
                tr.onclick = () => openModal(index);

                let pledgeAlert = '';
                if (row._mappedTransport.includes('未排程')) {
                    const days = getDaysDiff(row._mappedPledge);
                    if (days !== null && days <= 7 && days >= -30) {
                        pledgeAlert = `<span class="ml-2 inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium bg-red-500/20 text-red-400 border border-red-500/30 animate-pulse">即將到貨</span>`;
                    }
                }

                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-slate-300 font-medium">${row._mappedDate}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-blue-400 font-mono text-xs">${row._mappedOrder}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-slate-300">${row._mappedCustomer}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 py-1 bg-slate-700/50 rounded text-xs text-slate-400 border border-slate-600">${row._mappedStatus} / ${row._mappedTransport}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-slate-300">${row._mappedPledge}${pledgeAlert}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-emerald-400 font-mono group-hover:font-bold">${formatTWD(row._taxFree)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('search-input').addEventListener('input', filterAndRender);
        document.getElementById('start-month').addEventListener('change', filterAndRender);
        document.getElementById('end-month').addEventListener('change', filterAndRender);

        function openModal(index) {
            const data = currentFilteredData[index];
            if(!data) return;

            document.getElementById('modal-order-id').innerText = `單號: ${data._mappedOrder || '無'}`;
            
            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = '';
            
            const orderFields = ['顧客姓名', '手機', '訂單狀態', '運送狀態', '接單日', '出貨日', '時間', '貨押日', '備註'];
            const amountFields = ['82+28大類', '66大類', '總計', '除稅額']; 

            const renderField = (key, value, highlight = false) => {
                if(value === undefined || value === '') return;
                const div = document.createElement('div');
                div.className = 'flex flex-col gap-1';
                div.innerHTML = `
                    <span class="text-xs text-slate-500 uppercase tracking-wider">${key}</span>
                    <span class="text-sm ${highlight ? 'text-blue-400 font-mono text-base' : 'text-slate-200'}">${value}</span>
                `;
                modalBody.appendChild(div);
            };

            orderFields.forEach(k => {
                const foundKey = findKey(data, [k]);
                if (foundKey) renderField(k, data[foundKey]);
            });
            
            renderField('除稅後業績 (系統計算)', formatTWD(data._taxFree), true);
            
            amountFields.forEach(k => {
                const foundKey = findKey(data, [k]);
                if (foundKey) renderField(k, data[foundKey], k.includes('總計'));
            });

            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        }
        
        function closeModal() {
            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('modal-content');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        window.onload = fetchData;
    </script>
</body>
</html>
